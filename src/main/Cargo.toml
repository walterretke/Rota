[package]
name = "rota"
version = "0.1.0"
description = "Rota: análise de ranqueada para League of Legends"
edition = "2021"
rust-version = "1.85"

[lib]
name = "rota_lib"
path = "lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rota"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
# TLS nativo do Windows (SChannel): não exige ferramentas extras para compilar
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "gzip", "query", "http2", "charset"] }
native-tls = "0.2"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[profile.release]
# Binário pequeno e rápido: o app roda ao lado do jogo
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
